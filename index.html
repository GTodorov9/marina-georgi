<!doctype html>
<html lang="bg">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#efd3cb">
  <title>Покана за сватба</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Ballet:opsz@16..72&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,400;1,500;1,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link rel="preload" as="image" href="assets/paper.webp?v=2">
  <link rel="preload" as="image" href="assets/seal.webp?v=2">
  <link rel="preload" as="image" href="assets/seal-lines.webp?v=2">
  <link rel="preload" as="image" href="assets/hero.webp?v=1">
</head>
<body>
  <main class="stage" id="stage">
    <div class="scene" id="scene">
      <!-- Light escaping the envelope -->
      <div class="light" aria-hidden="true">
        <div class="glow"></div>
      </div>

      <!-- Front pocket -->
      <div class="pocket paper"></div>

      <!-- Top flap, flips open in 3D -->
      <div class="flap" id="flap">
        <div class="flap-face flap-front"></div>
        <div class="flap-face flap-inside"></div>
        <!-- Wax seal rides on the flap -->
        <button class="seal" id="seal" type="button" aria-label="Отворете поканата">
          <span class="seal-wax"></span>
          <span class="seal-wash sweep"></span>
          <span class="seal-glow"></span>
          <span class="seal-shine"></span>
          <span class="seal-initials" data-initials></span>
          <span class="seal-lit sweep"></span>
          <span class="seal-initials seal-initials-lit sweep" data-initials aria-hidden="true"></span>
        </button>
      </div>

    </div>

    <!-- The invitation itself, revealed after the envelope dissolves -->
    <div class="invite" id="invite" aria-hidden="true">
      <section class="hero">
        <div class="hero-bg" id="heroBg"></div>
        <div class="hero-text">
          <h1 class="hero-names">
            <span class="rise" style="--i:0" data-name1></span>
            <span class="rise hero-amp" style="--i:1">&amp;</span>
            <span class="rise" style="--i:2" data-name2></span>
          </h1>
          <p class="hero-kicker rise" style="--i:3">Сватбен ден</p>
          <span class="hero-divider rise" style="--i:4" aria-hidden="true"></span>
          <p class="hero-save rise" style="--i:5">Запазете датата</p>
        </div>
        <span class="scroll-cue" aria-hidden="true"></span>
      </section>

      <section class="arrived" id="arrived">
        <h2 class="arrived-title">
          <span class="press" style="--i:0">Денят</span>
          <span class="press" style="--i:1">настъпи!</span>
        </h2>
        <p class="arrived-text press" style="--i:2">Нямаме търпение да отпразнуваме<br>този ден с вас</p>
      </section>

      <section class="reveal-date" id="revealDate">
        <h2 class="rd-title">Разкрийте</h2>
        <p class="rd-sub">Изтрийте, за да откриете датата</p>
        <div class="rd-circles">
          <div class="rd-item">
            <div class="scratch" data-scratch>
              <span class="scratch-value" data-date-day></span>
              <canvas aria-hidden="true"></canvas>
            </div>
            <span class="rd-label">Ден</span>
          </div>
          <div class="rd-item">
            <div class="scratch" data-scratch>
              <span class="scratch-value scratch-month" data-date-month></span>
              <canvas aria-hidden="true"></canvas>
            </div>
            <span class="rd-label">Месец</span>
          </div>
          <div class="rd-item">
            <div class="scratch" data-scratch>
              <span class="scratch-value" data-date-year></span>
              <canvas aria-hidden="true"></canvas>
            </div>
            <span class="rd-label">Година</span>
          </div>
        </div>
        <p class="rd-done">Ще се видим на<br><span data-date></span>!</p>
      </section>
    </div>
    <div class="sparkles" id="sparkles" aria-hidden="true"></div>

    <p class="hint" id="hint">Докоснете печата</p>
    <button class="replay" id="replay" type="button" hidden>↺ Отново</button>
  </main>

  <audio id="music" preload="none" loop></audio>

  <script src="config.js"></script>
  <script src="main.js"></script>
</body>
</html>
