<!doctype html>
<html lang="bg">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#efd3cb">
  <title>Покана за сватба</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Ballet:opsz@16..72&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500;1,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link rel="preload" as="image" href="assets/paper.webp">
  <link rel="preload" as="image" href="assets/seal.webp">
  <link rel="preload" as="image" href="assets/seal-lines.webp">
</head>
<body>
  <main class="stage" id="stage">
    <div class="scene" id="scene">
      <!-- Inside back of the envelope + golden light that escapes when it opens -->
      <div class="env-back"></div>


      <!-- Light escaping the envelope, layered over the letter -->
      <div class="light" aria-hidden="true">
        <div class="rays"></div>
      </div>

      <!-- Front pocket with embossed fold lines -->
      <div class="pocket paper">
        <svg class="folds" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
          <path d="M0 100 L50 60 L100 100" class="fold-light"/>
          <path d="M0 100 L50 60 L100 100" class="fold-dark"/>
        </svg>
      </div>

      <!-- Top flap, flips open in 3D -->
      <div class="flap" id="flap">
        <div class="flap-face flap-front"></div>
        <div class="flap-face flap-inside"></div>
        <!-- Wax seal rides on the flap -->
        <button class="seal" id="seal" type="button" aria-label="Отворете поканата">
          <span class="seal-wax"></span>
          <span class="seal-wash sweep"></span>
          <span class="seal-glow"></span>
          <span class="seal-shine"></span>
          <span class="seal-initials" data-initials></span>
          <span class="seal-lit sweep"></span>
          <span class="seal-initials seal-initials-lit sweep" data-initials aria-hidden="true"></span>
        </button>
      </div>

    </div>

    <div class="bloom" aria-hidden="true"></div>
    <!-- Placeholder for the phase-2 scene -->
    <article class="letter" id="letter" aria-hidden="true">
      <p class="letter-kicker">Със семействата си ви канят</p>
      <h1 class="letter-names"><span data-name1></span><em class="amp">&amp;</em><span data-name2></span></h1>
      <p class="letter-date" data-date></p>
    </article>
    <div class="sparkles" id="sparkles" aria-hidden="true"></div>

    <p class="hint" id="hint">Докоснете печата</p>
    <button class="replay" id="replay" type="button" hidden>↺ Отново</button>
  </main>

  <audio id="music" preload="none" loop></audio>

  <script src="config.js"></script>
  <script src="main.js"></script>
</body>
</html>
